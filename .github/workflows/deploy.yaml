name: Deploy AWS Infrastructure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/GitHubOIDCDeployRole
          aws-region: ap-southeast-1

      - name: Validate template
        run: aws cloudformation validate-template --template-body file://cloudformation/infrastructure.yaml

      - name: Deploy stack
        run: |
          aws cloudformation deploy \
            --stack-name demo-app-stack \
            --template-file cloudformation/infrastructure.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides ProjectName=demo-app ContainerImage=$ECR_IMAGE_URI
